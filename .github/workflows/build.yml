name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proj && cd proj
          mkdir -p app
          cat > app/build.gradle.kts <<'RLEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.reelslimiter"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.reelslimiter"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          RLEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'RLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ReelsService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          RLEOF
          mkdir -p app/src/main/java/com/example/reelslimiter
          cat > app/src/main/java/com/example/reelslimiter/MainActivity.kt <<'RLEOF'
          package com.example.reelslimiter

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var igInfo: TextView
              private lateinit var ytInfo: TextView
              private lateinit var igLimit: EditText
              private lateinit var ytLimit: EditText
              private lateinit var diagBtn: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val pad = (20 * d).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }

                  fun text(size: Float, bold: Boolean = false) = TextView(this).apply {
                      textSize = size
                      if (bold) setTypeface(typeface, android.graphics.Typeface.BOLD)
                      setPadding(0, pad / 2, 0, pad / 2)
                  }

                  root.addView(text(24f, true).apply { this.text = "Reels Sınırı" })
                  status = text(15f).also { root.addView(it) }

                  root.addView(Button(this).apply {
                      text = "Erişilebilirlik ayarlarını aç"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })

                  root.addView(text(18f, true).apply { this.text = "Bugün" })
                  igInfo = text(16f).also { root.addView(it) }
                  ytInfo = text(16f).also { root.addView(it) }

                  root.addView(text(18f, true).apply { this.text = "Günlük sınır" })

                  fun limitField(hint: String): EditText = EditText(this).apply {
                      this.hint = hint
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }
                  igLimit = limitField("Instagram Reels sınırı").also { root.addView(it) }
                  ytLimit = limitField("YouTube Shorts sınırı").also { root.addView(it) }

                  root.addView(Button(this).apply {
                      text = "Kaydet"
                      setOnClickListener {
                          val ig = igLimit.text.toString().toIntOrNull()
                          val yt = ytLimit.text.toString().toIntOrNull()
                          if (ig == null || yt == null || ig < 0 || yt < 0) {
                              Toast.makeText(context, "Geçerli sayılar gir", Toast.LENGTH_SHORT).show()
                          } else {
                              Store.setLimit(context, Store.IG, ig)
                              Store.setLimit(context, Store.YT, yt)
                              Toast.makeText(context, "Kaydedildi", Toast.LENGTH_SHORT).show()
                              refresh()
                          }
                      }
                  })

                  root.addView(text(18f, true).apply { this.text = "Teşhis (sorun olursa)" })
                  diagBtn = Button(this).apply {
                      setOnClickListener {
                          Store.setDiag(context, !Store.diagOn(context))
                          refresh()
                      }
                  }
                  root.addView(diagBtn)
                  root.addView(Button(this).apply {
                      text = "Teşhis kaydını kopyala"
                      setOnClickListener {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("teshis", Store.dumps(context)))
                          Toast.makeText(context, "Kopyalandı", Toast.LENGTH_SHORT).show()
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Teşhis kaydını temizle"
                      setOnClickListener {
                          Store.clearDumps(context)
                          Toast.makeText(context, "Temizlendi", Toast.LENGTH_SHORT).show()
                      }
                  })

                  setContentView(ScrollView(this).apply {
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      addView(root)
                  })

                  igLimit.setText(Store.limit(this, Store.IG).toString())
                  ytLimit.setText(Store.limit(this, Store.YT).toString())
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun serviceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return enabled.contains("$packageName/")
              }

              private fun refresh() {
                  status.text = if (serviceEnabled())
                      "Durum: Açık ✅" else "Durum: Kapalı ❌ (aşağıdan servisi etkinleştir)"
                  diagBtn.text = if (Store.diagOn(this)) "Teşhis modu: AÇIK (kapatmak için dokun)" else "Teşhis modu: kapalı (açmak için dokun)"
                  igInfo.text = "Instagram Reels: ${Store.count(this, Store.IG)} / ${Store.limit(this, Store.IG)}"
                  ytInfo.text = "YouTube Shorts: ${Store.count(this, Store.YT)} / ${Store.limit(this, Store.YT)}"
              }
          }
          RLEOF
          mkdir -p app/src/main/java/com/example/reelslimiter
          cat > app/src/main/java/com/example/reelslimiter/ReelsService.kt <<'RLEOF'
          package com.example.reelslimiter

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.TextView
          import android.widget.Toast

          class ReelsService : AccessibilityService() {

              companion object {
                  const val IG_PKG = "com.instagram.android"
                  const val YT_PKG = "com.google.android.youtube"

                  // Reels / Shorts kaydırma listesini tanıyan görünüm kimlikleri.
                  // Uygulama güncellemeleriyle değişebilir; uygulamadaki "Teşhis" bölümü doğru kimliği bulmaya yarar.
                  val IG_IDS = listOf(
                      "com.instagram.android:id/clips_viewer_view_pager",
                      "com.instagram.android:id/clips_swipe_refresh_container",
                      "com.instagram.android:id/clips_viewer_video_layout"
                  )
                  val YT_IDS = listOf(
                      "com.google.android.youtube:id/reel_recycler",
                      "com.google.android.youtube:id/reel_player_page_container",
                      "com.google.android.youtube:id/shorts_container"
                  )
              }

              private var wm: WindowManager? = null
              private var overlay: TextView? = null
              private var lastCount = 0L
              private var lastCheck = 0L
              private var lastToast = 0L
              private var lastBack = 0L
              private var lastReelsSeen = 0L
              private var lastDiag = 0L
              private var shownText = ""
              private var shownRed = false
              private var inReels = false

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
              }

              override fun onInterrupt() { hide() }

              override fun onDestroy() {
                  hide()
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent) {
                  val pkg = e.packageName?.toString() ?: return

                  // Kendi sayaç kutumuzun olayları (titremenin sebebi buydu) yok sayılır
                  if (pkg == packageName) return

                  val app = when (pkg) {
                      IG_PKG -> Store.IG
                      YT_PKG -> Store.YT
                      else -> {
                          if (e.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                              !pkg.contains("systemui") && !pkg.contains("inputmethod") &&
                              !pkg.contains("keyboard")) {
                              inReels = false
                              hide()
                          }
                          return
                      }
                  }

                  val ids = if (app == Store.IG) IG_IDS else YT_IDS
                  val now = SystemClock.uptimeMillis()
                  val type = e.eventType

                  diag(app, now)

                  if (type == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED || now - lastCheck > 250) {
                      lastCheck = now
                      val r = detect(ids)
                      if (r == true) {
                          inReels = true
                          lastReelsSeen = now
                      } else if (r == false && now - lastReelsSeen > 1500) {
                          inReels = false
                      }
                  }

                  if (!inReels) { hide(); return }

                  val label = if (app == Store.IG) "Reels" else "Shorts"
                  val limit = Store.limit(this, app)
                  var count = Store.count(this, app)

                  if (count >= limit) {
                      show("$label limiti doldu ($count/$limit)", true)
                      if (now - lastToast > 2000) {
                          lastToast = now
                          Toast.makeText(this, "Günlük $label limitin doldu", Toast.LENGTH_SHORT).show()
                      }
                      goBack(now)
                      return
                  }

                  // Sadece Reels/Shorts listesinden gelen kaydırmalar sayılır (sohbet, gönderi kaydırmaları sayılmaz)
                  if (type == AccessibilityEvent.TYPE_VIEW_SCROLLED &&
                      now - lastCount > 700 && fromReels(e.source, ids)) {
                      lastCount = now
                      count = Store.inc(this, app)
                      if (count >= limit) {
                          show("$label limiti doldu ($count/$limit)", true)
                          goBack(now)
                          return
                      }
                  }
                  show("$label: $count / $limit", false)
              }

              private fun goBack(now: Long) {
                  if (now - lastBack > 1000) {
                      lastBack = now
                      performGlobalAction(GLOBAL_ACTION_BACK)
                  }
              }

              // Olayın kaynağı (ya da üst öğelerinden biri) Reels listesi mi?
              private fun fromReels(src: AccessibilityNodeInfo?, ids: List<String>): Boolean {
                  var n = src
                  var i = 0
                  while (n != null && i < 8) {
                      val id = n.viewIdResourceName
                      if (id != null && id in ids) return true
                      n = n.parent
                      i++
                  }
                  return false
              }

              // true: Reels ekranı görünür, false: görünmüyor, null: ekran bilgisi okunamadı
              private fun detect(ids: List<String>): Boolean? {
                  val root = rootInActiveWindow ?: return null
                  val h = resources.displayMetrics.heightPixels
                  val r = Rect()
                  for (id in ids) {
                      for (n in root.findAccessibilityNodeInfosByViewId(id)) {
                          if (!n.isVisibleToUser) continue
                          n.getBoundsInScreen(r)
                          if (r.height() >= h * 0.6) return true
                      }
                  }
                  return false
              }

              // ---- Teşhis: ekrandaki görünüm kimliklerini kaydeder ----
              private fun diag(app: String, now: Long) {
                  if (!Store.diagOn(this)) return
                  if (now - lastDiag < 1500) return
                  lastDiag = now
                  val root = rootInActiveWindow ?: return
                  val h = resources.displayMetrics.heightPixels
                  val lines = HashSet<String>()
                  collect(root, h, lines, 0)
                  val marked = lines.filter { it.contains("BIG") || it.contains("SEL") }.sorted()
                  val others = lines.filter { !it.contains("BIG") && !it.contains("SEL") }.sorted().take(40)
                  Store.addDump(this, app, marked.joinToString("|"), (marked + others).joinToString("\n"))
              }

              private fun collect(n: AccessibilityNodeInfo?, h: Int, out: MutableSet<String>, d: Int) {
                  if (n == null || d > 30) return
                  val id = n.viewIdResourceName
                  if (id != null && n.isVisibleToUser) {
                      val r = Rect()
                      n.getBoundsInScreen(r)
                      val big = if (r.height() >= h * 0.6) " BIG" else ""
                      val sel = if (n.isSelected) " SEL" else ""
                      out.add(id.substringAfter(":id/") + big + sel)
                  }
                  for (i in 0 until n.childCount) collect(n.getChild(i), h, out, d + 1)
              }

              private fun show(text: String, red: Boolean) {
                  val manager = wm ?: return
                  if (overlay == null) {
                      val tv = TextView(this).apply {
                          setTextColor(Color.WHITE)
                          textSize = 14f
                          setPadding(36, 14, 36, 14)
                      }
                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          y = 140
                      }
                      manager.addView(tv, lp)
                      overlay = tv
                      shownText = ""
                  }
                  if (text == shownText && red == shownRed) return
                  shownText = text
                  shownRed = red
                  overlay?.apply {
                      this.text = text
                      background = GradientDrawable().apply {
                          cornerRadius = 60f
                          setColor(if (red) 0xDDC62828.toInt() else 0xCC000000.toInt())
                      }
                  }
              }

              private fun hide() {
                  val v = overlay ?: return
                  try { wm?.removeView(v) } catch (_: Exception) {}
                  overlay = null
                  shownText = ""
              }
          }
          RLEOF
          mkdir -p app/src/main/java/com/example/reelslimiter
          cat > app/src/main/java/com/example/reelslimiter/Store.kt <<'RLEOF'
          package com.example.reelslimiter

          import android.content.Context
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Store {
              const val IG = "ig"
              const val YT = "yt"
              private const val SEP = "\n=====\n"

              private fun sp(c: Context) = c.getSharedPreferences("reels", Context.MODE_PRIVATE)
              private fun today() = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())

              fun count(c: Context, app: String): Int = sp(c).getInt("count_${app}_${today()}", 0)

              fun inc(c: Context, app: String): Int {
                  val n = count(c, app) + 1
                  sp(c).edit().putInt("count_${app}_${today()}", n).apply()
                  return n
              }

              fun limit(c: Context, app: String): Int = sp(c).getInt("limit_$app", 50)

              fun setLimit(c: Context, app: String, v: Int) {
                  sp(c).edit().putInt("limit_$app", v).apply()
              }

              // ---- Teşhis modu ----
              fun diagOn(c: Context): Boolean = sp(c).getBoolean("diag", false)

              fun setDiag(c: Context, v: Boolean) {
                  sp(c).edit().putBoolean("diag", v).apply()
              }

              fun dumps(c: Context): String = sp(c).getString("dumps", "") ?: ""

              fun clearDumps(c: Context) {
                  sp(c).edit().remove("dumps").remove("dump_sig").apply()
              }

              fun addDump(c: Context, app: String, sig: String, body: String) {
                  val s = sp(c)
                  if (s.getString("dump_sig", "") == sig) return
                  val time = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  val list = (s.getString("dumps", "") ?: "").split(SEP).filter { it.isNotBlank() }.toMutableList()
                  list.add("[$time $app]\n$body")
                  while (list.size > 6) list.removeAt(0)
                  s.edit().putString("dumps", list.joinToString(SEP)).putString("dump_sig", sig).apply()
              }
          }
          RLEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'RLEOF'
          <resources>
              <string name="app_name">Reels Sınırı</string>
              <string name="service_desc">Instagram Reels ve YouTube Shorts kaydırmalarını sayar ve günlük sınıra ulaşınca engeller. Hiçbir veri telefondan çıkmaz.</string>
          </resources>
          RLEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'RLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewScrolled|typeWindowContentChanged|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          RLEOF
          cat > build.gradle.kts <<'RLEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          RLEOF
          cat > gradle.properties <<'RLEOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          RLEOF
          cat > settings.gradle.kts <<'RLEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ReelsLimiter"
          include(":app")
          RLEOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ReelsLimiter-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk

